name: Runner candidate (macOS + Windows)
on:
  push:
    branches: [codex/windows-runner-onboarding, codex/runner-bootstrapper]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BAITE_DISABLE_EXTERNAL_SYNC: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ startsWith(matrix.os, 'windows') && 'x64' || 'arm64' }}
      - name: Install test and timezone dependencies
        id: dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --require-hashes --only-binary=:all: -r runner/requirements.lock
          python -m pip install -r tests/requirements.txt
          python -m playwright install chromium
      - name: API, filesystem, installer and existing regression tests
        run: python -m unittest discover -s tests -v
      - name: Three isolated Runners, offline recovery, ACK and credential rotation
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python tests/e2e_demo.py
      - name: Native installer and background task isolated acceptance
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python tests/macos_installer_smoke.py --local-runtime
      - name: Browser onboarding and one-time credential UI
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python tests/browser_onboarding.py
      - name: Build standalone Runtime and graphical installer
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          python -m pip install -r bootstrapper/build-requirements.txt
          python deploy/build_bootstrapper.py --version 0.1.0-candidate --output bootstrap-artifacts
      - name: Frozen artifact smoke test
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python tests/packaged_smoke.py bootstrap-artifacts
      - name: Frozen Runtime end-to-end acceptance
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python tests/frozen_runtime_e2e.py bootstrap-artifacts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        with:
          name: rdos-bootstrap-${{ matrix.os }}
          path: |
            bootstrap-artifacts/*.dmg
            bootstrap-artifacts/*.exe
            bootstrap-artifacts/*.tar.gz
            bootstrap-artifacts/*.zip
          retention-days: 14
