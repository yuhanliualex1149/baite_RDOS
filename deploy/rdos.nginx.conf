# Include at http scope as a NEW vhost, never inside the existing yjmt.cn server.
limit_req_zone $binary_remote_addr zone=rdos_login:1m rate=5r/m;

server {
    listen 443 ssl;
    server_name rdos.yjmt.cn;
    ssl_certificate /etc/baite-rdos/tls/fullchain.pem;
    ssl_certificate_key /etc/baite-rdos/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/baite-rdos/nginx-access.log;
    error_log /var/log/baite-rdos/nginx-error.log warn;
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /api/auth/login {
        limit_req zone=rdos_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }
}
