[Service]
EnvironmentFile=/etc/baite-rdos/rdos2.env
EnvironmentFile=/opt/baite-rdos/current/release.env
ExecStart=
ExecStart=/bin/sh -c 'exec /opt/baite-rdos/current/.venv/bin/uvicorn server.production_app:app --host 127.0.0.1 --port 8010 --workers 1 --root-path /baite-rdos --proxy-headers --forwarded-allow-ips=127.0.0.1 >> /var/log/baite-rdos/panel.log 2>&1'
