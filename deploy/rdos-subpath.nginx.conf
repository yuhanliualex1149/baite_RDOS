# Include inside the existing yjmt.cn server; preserve every existing location.
location = /baite-rdos {
    return 308 https://yjmt.cn/baite-rdos/$is_args$args;
}

location = /baite-rdos/api/auth/login {
    if ($scheme != https) { return 308 https://yjmt.cn$request_uri; }
    if ($host != yjmt.cn) { return 308 https://yjmt.cn$request_uri; }
    limit_req zone=rdos_login burst=5 nodelay;
    limit_req_status 429;
    access_log /var/log/baite-rdos/nginx-access.log;
    error_log /var/log/baite-rdos/nginx-error.log warn;
    proxy_pass http://127.0.0.1:8010/api/auth/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

# Immutable, hashed installer/runtime files; only publish a manifest after upload verification.
location ^~ /baite-rdos/downloads/ {
    if ($scheme != https) { return 308 https://yjmt.cn$request_uri; }
    if ($host != yjmt.cn) { return 308 https://yjmt.cn$request_uri; }
    alias /opt/baite-rdos/downloads/;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Disposition attachment always;
    access_log /var/log/baite-rdos/nginx-access.log;
}

location ^~ /baite-rdos/ {
    if ($scheme != https) { return 308 https://yjmt.cn$request_uri; }
    if ($host != yjmt.cn) { return 308 https://yjmt.cn$request_uri; }
    client_max_body_size 32m;
    access_log /var/log/baite-rdos/nginx-access.log;
    error_log /var/log/baite-rdos/nginx-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 180s;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}
